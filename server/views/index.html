<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="" id="form-data">
        <div>
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" value="" placeholder="Enter your full name" required>
        </div>
        <div>
            <label for="">usernamee</label>
            <input type="text" id="username" value="" placeholder="Enter your username" required>
        </div>
        <div>
            <label for="">Email</label>
            <input type="email" id="email" value="" placeholder="Enter your email" required>
        </div>
        <div>
            <label for="">Password</label>
            <input type="password" id="password" value="" placeholder="Enter password" required>
        </div>
        <div>
            <label for="role">Role</label>
            <select name="" id="role" title="Select role">
                <option value="user">User</option>
                <option value="admin">admin</option>
            </select>
        </div>
        <div>
            <label for="">Avatar</label>
            <input type="file" id="avatar" value="" accept="image/*" placeholder="Enter your avatar" required>
        </div>
        <button id="sendData" type="submit">Send</button>
    </form>
    <script src="app.js"></script>
</body>

</html>
